<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserve sua estadia - Pousada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Pousada</span>
    </div>
</nav>

<main class="container" style="max-width: 560px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-1">Faça sua reserva</h1>
            <p class="text-muted">Informe o período desejado e confirme.</p>

            <div id="mensagem" class="alert d-none" role="alert"></div>

            <form id="form-reserva" novalidate>
                <div class="mb-3">
                    <label for="clienteId" class="form-label">Cliente ID</label>
                    <input type="number" class="form-control" id="clienteId" min="1" step="1" required>
                    <div class="form-text">Campo temporário: por enquanto o cliente é identificado pelo código do cadastro.</div>
                    <div class="invalid-feedback">Informe o código do cliente.</div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <label for="dataEntrada" class="form-label">Entrada</label>
                        <input type="date" class="form-control" id="dataEntrada" required>
                        <div class="invalid-feedback">Informe a data de entrada.</div>
                    </div>
                    <div class="col-sm-6">
                        <label for="dataSaida" class="form-label">Saída</label>
                        <input type="date" class="form-control" id="dataSaida" required>
                        <div class="invalid-feedback">A saída deve ser depois da entrada.</div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="btnReservar">Reservar</button>
            </form>
        </div>
    </div>
</main>

<script src="js/reserva.js"></script>
</body>
</html>
